# Tests the C++ engine, compiles it to WebAssembly with Emscripten and publishes the game on GitHub Pages.
name: Test, build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: C++ engine tests (with AddressSanitizer and UBSan)
        run: SAN_CHECK=1 bash build.sh test
      - name: Play the whole game through the API (native server + bot)
        run: |
          g++ -std=c++17 -O1 -pthread -o build/server server/main_server.cpp engine/*.cpp
          (SLUG_SEED=7 ./build/server 8080 web > build/server.log 2>&1 &)
          sleep 2
          SLUG_SEED=7 node tools/bot.js 8080

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Compile the C++ engine to WebAssembly
        run: bash build.sh wasm
      - name: Stamp scripts and styles so browsers never show an old version
        run: sed -i -E "s#(css/style\.css|js/[a-z0-9]+\.js|engine/engine\.js)\"#\1?v=${GITHUB_SHA::7}\"#g" web/index.html
      - name: Keep only what the game needs
        run: rm -f web/sheet.html web/test3d.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
