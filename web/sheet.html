<!doctype html>
<html><head><meta charset="utf-8"><title>sprite sheet</title>
<style>body{margin:0;background:#2a3a4a;color:#fff;font:12px sans-serif} .row{display:flex;flex-wrap:wrap;gap:6px;padding:6px} canvas,img{background:#445;}</style></head>
<body><div class="row" id="a"></div><div class="row" id="b"></div>
<script src="js/art.js"></script>
<script>
const a=document.getElementById('a'), b=document.getElementById('b');
for (const n of ['kai','mossback','pim','kessa','ghoul_ice','minion','gorvax']) for (const v of (n==='kai'||n==='kessa'?['front','back','side']:['front'])) { const c=Art.sprite(n,v); c.style.height='300px'; a.appendChild(c); }
for (const e of ['Fire','Ice','Earth','Air','Energy','Ghoul']) { const i=new Image(); i.src=Art.portrait(e,180); b.appendChild(i); }
for (const z of ['grotto','hollows','vein','keep']) { const c=Art.floorTexture(z); c.style.height='140px'; b.appendChild(c); const r=Art.rockTexture(z); r.style.height='140px'; b.appendChild(r);}
b.appendChild(Art.lavaTexture()); b.appendChild(Art.waterTexture()); b.appendChild(Art.iceTexture());
</script></body></html>
