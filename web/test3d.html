<!doctype html>
<html><head><meta charset="utf-8"><title>3D test</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden} canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="vendor/babylon.js"></script>
<script src="js/art.js"></script><script src="js/art2.js"></script><script src="js/scene.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('dbg')) await fetch('api/debug', { method: 'POST', body: q.get('dbg') });
  const st = (await (await fetch('api/state', { method: 'POST' })).json()).state;
  const z = (await (await fetch('api/zone', { method: 'POST' })).json()).zone;
  World3D.init(document.getElementById('c'), q.get('q') || 'high');
  World3D.buildZone(z, st);
  window.ready = true;
})().catch(e => { console.error(e); window.err = String(e); });
</script></body></html>
